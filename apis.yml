aid: hotdoc
url: https://raw.githubusercontent.com/api-evangelist/hotdoc/refs/heads/main/apis.yml
name: HotDoc
kind: company
description: >-
  HotDoc is an Australian patient-engagement platform, founded in 2012 and headquartered
  in Melbourne, that connects patients with general practices, dentists, and specialists.
  Roughly one in three Australians use HotDoc to find and book healthcare, and the platform
  serves more than 21,000 practitioners across the country. Its clinic-facing SaaS provides
  online bookings, telehealth, appointment reminders, SMS recalls for clinical reminders and
  results, mobile and kiosk check-in, digital new-patient registration forms, online repeat
  prescription requests, and preventative-health outreach. HotDoc operates as an engagement
  layer on top of Australian practice-management systems (Best Practice, MedicalDirector,
  Zedmed, Genie, Cliniko, Nookal and others): a clinic connects HotDoc by entering its
  practice-management-system API key into the HotDoc dashboard, so HotDoc consumes those PMS
  APIs rather than publishing its own. HotDoc does operate a real OpenID Connect / OAuth 2.0
  authorization server (Rails/Doorkeeper) for clinic and partner sign-in, served with live
  discovery metadata and a JWKS, but exposes no self-serve public developer portal, no
  documented third-party REST/OpenAPI, and no HL7 FHIR CapabilityStatement; its integration
  surface is partner/PMS-gated. HotDoc was acquired by Potentia in February 2026.
